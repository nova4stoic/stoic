<style>
  :root {
    --bg: #ffffff;
    --ink: #000000;
    --muted: #6b6b70;
    color-scheme: light dark;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #000000; --ink: #ffffff; --muted: #98989d; }
  }
  :root[data-theme="dark"] { --bg: #000000; --ink: #ffffff; --muted: #98989d; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
    display: flex; align-items: center; justify-content: center;
  }
  main { width: 100%; max-width: 40rem; padding: 1.5rem; text-align: center; }
  #quote { margin: 0 0 1rem; font-size: 1.75rem; line-height: 1.3; text-wrap: balance; }
  #author { margin: 0; font-size: 1rem; color: var(--muted); }
</style>
</head>
<body>
<main>
  <p id="quote"></p>
  <p id="author"></p>
</main>

<script>
  // THE LIST: one line per quote. Add a comma after every line except the last.
  const QUOTES = [
    { text: "Vivi come se tu dovessi morire subito. Pensa come se tu non dovessi morire mai.", author: "Julius Evola" }
  ];

  // Today's date as text, e.g. "2026-10-23" (uses the phone's local time, so it changes at local midnight).
  function todayKey() {
    const d = new Date();
    const m = String(d.getMonth() + 1).padStart(2, "0");
    const day = String(d.getDate()).padStart(2, "0");
    return d.getFullYear() + "-" + m + "-" + day;
  }

  // THE MEMORY: the browser keeps the day and the chosen position between visits.
  function loadSaved() {
    try { return JSON.parse(localStorage.getItem("stoic-pick")); } catch (e) { return null; }
  }
  function save(pick) {
    try { localStorage.setItem("stoic-pick", JSON.stringify(pick)); } catch (e) {}
  }

  // THE DAILY PICK: if the saved day isn't today, choose a new random quote.
  let current = null;
  function updateQuote() {
    if (QUOTES.length === 0) return;
    const saved = loadSaved();
    const valid = saved && saved.day === todayKey() && saved.index >= 0 && saved.index < QUOTES.length;
    current = valid ? saved : { day: todayKey(), index: Math.floor(Math.random() * QUOTES.length) };
    if (!valid) save(current);
    render();
  }

  function render() {
    const q = QUOTES[current.index];
    document.getElementById("quote").textContent = q.text;
    document.getElementById("author").textContent = q.author;
  }

  updateQuote();
  // Check again when the person comes back to the page, so it changes after midnight.
  document.addEventListener("visibilitychange", () => { if (!document.hidden) updateQuote(); });
</script>
